name: Build frontend

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate, build and package
        run: npm run package

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: brujula-vocacional-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: brujula-vocacional-zip
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
